server:
  port: 8080
  servlet:
    session:
      cookie:
        name: INSURANCESESSION
        http-only: true
        same-site: lax

insurance:
  weather:
    base-url: ${WEATHER_API_BASE_URL:https://apis.data.go.kr/1390802/AgriWeather}
    service-key: ${WEATHER_API_SERVICE_KEY:}
    station-service-key: ${WEATHER_STATION_API_SERVICE_KEY:${WEATHER_API_SERVICE_KEY:}}
  identity:
    encryption-key: ${INSURANCE_IDENTITY_ENCRYPTION_KEY:}
  claim-intake:
    enabled: ${CLAIM_INTAKE_ENABLED:true}
    delay-ms: ${CLAIM_INTAKE_DELAY_MS:60000}
  farm:
    base-url: ${FARM_API_BASE_URL:http://127.0.0.1:8081}
    service-token: ${FARM_API_SERVICE_TOKEN:}
    consent-version: farm-platform-v1
    # 농업 V2 배포·실제 통신 확인 후 활성화한다. 기본값은 기존 내국인 API 유지다.
    worker-verification-v2-enabled: ${FARM_WORKER_VERIFICATION_V2_ENABLED:false}
    # 보험 서버용 급여 계좌 조회 API가 농업에 준비된 뒤 활성화한다. 마이페이지 API와는 별도다.
    salary-account-query-enabled: ${FARM_SALARY_ACCOUNT_QUERY_ENABLED:false}
    polling:
      # 활성화하면 GMT+9 기준 매일 18시에 조회한다. 간격 기반 delay-ms 설정은 사용하지 않는다.
      enabled: ${FARM_WORK_POLLING_ENABLED:false}
      page-size: 100
      max-pages-per-worker: 10

spring:
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  application:
    name: insurance-api
  rabbitmq:
    username: wonday
    password: ${RABBITMQ_PASSWORD}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/insurance_db
    username: ${MYSQL_USER:wonday}
    password: ${MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate.type.java_time_use_direct_jdbc: true
    hibernate:
      ddl-auto: validate
