plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wonday'
version = '0.0.1-SNAPSHOT'
description = 'insurance-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 별도 프로세스 명령의 기본 미리보기·오류 출력도 실제 실행으로 검증한다. 비밀 설정은 포함하지 않는다.
    systemProperty 'identityMigrationClasspath', sourceSets.main.runtimeClasspath.asPath
}

// 농업 서버와 같은 실행 계약: 기본은 미리보기, 명시적으로 선택한 내국인 ID만 이관한다.
tasks.register('migrateMemberIdentity', JavaExec) {
    description = 'Previews legacy insurance identity migration; apply is explicitly opt-in.'
    group = 'application'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wonday.insurance.member.migration.MemberIdentityMigrationCommand'
    if (project.hasProperty('confirmedDomesticMemberIds')) {
        args '--confirmed-domestic-member-ids=' + project.property('confirmedDomesticMemberIds')
    }
    if (project.findProperty('applyIdentityMigration') == 'true') {
        args '--apply'
    }
}
