plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wonday'
version = '0.0.1-SNAPSHOT'
description = 'farm-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    // 통합 테스트는 실행마다 새 MySQL 컨테이너를 사용해 로컬 개발 DB와 격리한다 (Docker 필요).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 테스트 종류: @Tag("integration")이 붙은 Spring 통합 테스트와 그 밖의 단위 테스트로 나눈다.
def integrationTag = 'integration'
// 운영 코드 결함을 재현하는 테스트. 수정 전까지 실패하므로 기본 실행(test)에서 빼고 knownDefectTest로 따로 실행한다.
def knownDefectTag = 'known-defect'

// 명시적으로 실행하는 커버리지 검사 기준(라인): 단위 90%, 통합 80%.
// 개발 중 기본 test와 CI에서는 수치로 차단하지 않고 측정·리포트만 유지한다.
// 실행 진입점은 두 측정 모두에서 제외한다.
def alwaysExcluded = ['com/wonday/farm/FarmApiApplication.class']
// SecurityConfig는 필터 체인 조립만 담당하므로 단위가 아닌 통합 테스트로 검증한다.
def unitExcluded = alwaysExcluded + ['com/wonday/farm/auth/SecurityConfig*.class']

def coverageClasses = { List<String> excludes ->
    files(sourceSets.main.output.classesDirs.files.collect { dir -> fileTree(dir) { exclude excludes } })
}

def unitTest = tasks.register('unitTest', Test) {
    description = 'Runs unit tests (no Spring context).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags integrationTag, knownDefectTag }
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs Spring integration tests (requires Docker for the MySQL container).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags integrationTag
        excludeTags knownDefectTag
    }
    shouldRunAfter unitTest
}

tasks.register('knownDefectTest', Test) {
    description = 'Runs reproduction tests for known production defects. Fails until the defects are fixed.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags knownDefectTag }
    shouldRunAfter integrationTest
}

def jacocoUnitTestReport = tasks.register('jacocoUnitTestReport', JacocoReport) {
    description = 'Generates the unit test coverage report.'
    group = 'verification'
    dependsOn unitTest
    executionData unitTest.get()
    sourceSets sourceSets.main
    classDirectories.setFrom(coverageClasses(unitExcluded))
    reports { xml.required = true }
}

def jacocoIntegrationTestReport = tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    description = 'Generates the integration test coverage report.'
    group = 'verification'
    dependsOn integrationTest
    executionData integrationTest.get()
    sourceSets sourceSets.main
    classDirectories.setFrom(coverageClasses(alwaysExcluded))
    reports { xml.required = true }
}

def jacocoUnitTestCoverageVerification = tasks.register('jacocoUnitTestCoverageVerification', JacocoCoverageVerification) {
    description = 'Opt-in check: fails when unit test line coverage is below 90%.'
    group = 'verification'
    dependsOn unitTest
    executionData unitTest.get()
    sourceSets sourceSets.main
    classDirectories.setFrom(coverageClasses(unitExcluded))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

def jacocoIntegrationTestCoverageVerification = tasks.register('jacocoIntegrationTestCoverageVerification', JacocoCoverageVerification) {
    description = 'Fails the build when integration test line coverage is below 80%.'
    group = 'verification'
    dependsOn integrationTest
    executionData integrationTest.get()
    sourceSets sourceSets.main
    classDirectories.setFrom(coverageClasses(alwaysExcluded))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// 합산 리포트: 단위와 통합 실행 결과를 합쳐 기존 build/reports/jacoco/test 경로에 만든다.
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn unitTest, integrationTest
    executionData.setFrom([])
    executionData unitTest.get(), integrationTest.get()
    classDirectories.setFrom(coverageClasses(alwaysExcluded))
    reports { xml.required = true }
}

// 기능 구현 단계(2026-11-24~)에는 CI와 README의 `./gradlew test`가 단위 테스트만 실행한다.
// 단위 테스트 실패는 빌드를 실패시키며, 커버리지 수치만으로는 실패시키지 않는다.
// 통합 테스트는 기능이 갖춰진 뒤 `./gradlew fullTest`(또는 `integrationTest`)로 따로 실행한다.
tasks.named('test') {
    description = 'Runs unit tests with the unit coverage report (no coverage threshold gate).'
    enabled = false
    dependsOn unitTest, jacocoUnitTestReport
}

// 단위 + 통합 테스트, 리포트 3종(단위·통합·합산), 커버리지 기준 2개를 모두 실행한다 (Docker 필요).
tasks.register('fullTest') {
    description = 'Runs unit and integration tests with all coverage reports and gates (requires Docker).'
    group = 'verification'
    dependsOn unitTest, integrationTest,
        jacocoUnitTestReport, jacocoIntegrationTestReport,
        jacocoUnitTestCoverageVerification, jacocoIntegrationTestCoverageVerification
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('check') {
    dependsOn tasks.named('test')
}

/*
 * JPA 식별정보 이관 도구. 기본은 미리보기이며 웹 서버·전체 Spring 컨텍스트·테스트를 실행하지 않는다.
 * 실제 반영은 -PapplyIdentityMigration=true를 지정해야 한다. 비밀키·DB 비밀번호는 환경변수로만 받는다.
 */
tasks.register('migrateMemberIdentity', JavaExec) {
    description = 'Previews verified domestic member identity migration; apply is explicitly opt-in.'
    group = 'application'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wonday.farm.member.identity.migration.MemberIdentityMigrationCommand'
    if (project.hasProperty('confirmedDomesticMemberIds')) {
        args '--confirmed-domestic-member-ids=' + project.property('confirmedDomesticMemberIds')
    }
    if (project.findProperty('applyIdentityMigration') == 'true') {
        args '--apply'
    }
}
