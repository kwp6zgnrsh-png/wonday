server:
  port: 8081
  servlet:
    session:
      cookie:
        # 보험 API와 같은 호스트에서 실행해도 농업 세션 쿠키를 이름으로 구분한다.
        name: FARMSESSION
        # 브라우저 스크립트의 접근을 막고, 다른 사이트에서 시작된 요청의 쿠키 전송을 제한한다.
        http-only: true
        same-site: lax

spring:
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  application:
    name: farm-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/farm_db
    username: ${MYSQL_USER:wonday}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

farm:
  insurance:
    service-token: ${FARM_API_SERVICE_TOKEN:}
  identity:
    # 검토·이관 후 ENCRYPTED로 명시 전환한다. 다른 기능의 로그인 설정은 바꾸지 않는다.
    lookup-mode: ${FARM_IDENTITY_LOOKUP_MODE:LEGACY}
    encryption-key: ${FARM_IDENTITY_ENCRYPTION_KEY:}
    hmac-key: ${FARM_IDENTITY_HMAC_KEY:}
  salary-account:
    encryption-key: ${FARM_SALARY_ACCOUNT_ENCRYPTION_KEY:}
